# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

#: Fonts

# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font' postscript_name=FiraCodeNF-Reg
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

#: Font size (in pts).
font_size 16

#: Window

# 只保留标题栏，隐藏边框和装饰，使界面更简洁
hide_window_decorations    titlebar-only

# 终端内边距
window_padding_width   5

# 背景透明度 0.7（30%透明）
background_opacity    0.7

# 背景模糊程度（数值越大越模糊，需 Kitty 编译时启用 blur）
background_blur    30

# 记住窗口大小，下次启动时恢复
remember_window_size    yes

# ========== 标签栏（Tab Bar）设置 ==========
# 标签栏放在顶部（也可改为 bottom 或 hidden）
tab_bar_edge    top

# 使用 Powerline 风格的箭头分隔标签
tab_bar_style    powerline

# Powerline 标签的箭头样式为斜角（slanted）
tab_powerline_style    slanted

# ===== 光标动态效果 =====

# 让光标颜色跟随当前光标所在的文本颜色（而非固定颜色）
cursor none

# 开启光标拖尾效果（1=开启，0=关闭）
cursor_trail 1

# 拖尾的衰减速度和长度：
# 第一个数：衰减速度（越小尾巴消失越慢）
# 第二个数：拖尾长度（越大尾巴越长）
cursor_trail_decay 0.1 0.4

# 光标移动多少个字符后才开始显示拖尾
# 0 表示只要移动1个字符就显示，这样看着更平滑
cursor_trail_start_threshold 0

# 禁用shell集成对kitty光标的控制，否则光标形状无法设置，默认线状
shell_integration no-cursor
# 光标形状
cursor_shape block

# 将ctrl+alt+a 设置为广播快捷键
map ctrl+alt+a launch --allow-remote-control kitty +kitten broadcast

